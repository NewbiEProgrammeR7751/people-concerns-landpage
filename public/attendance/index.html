<title>HR Attendance · People concerns (Demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: two live phones (employee + manager) beside a numbered presenter script; app mode is one full-screen phone.
   Single dark look on purpose, following the People concerns brand: navy ground, teal = in, coral = out. */
:root {
  color-scheme: dark;
  --ink: #080e1a;
  --surface: #101a2b;
  --navy: #142030;
  --deep: #0b1422;
  --raise: #1a2a41;
  --line: rgba(231, 236, 243, 0.09);
  --line-2: rgba(231, 236, 243, 0.18);
  --text: #e7ecf3;
  --muted: #9ba8ba;
  --faint: #6f7d92;
  --coral: #F96B57;
  --teal: #0A8E8E;
  --teal-hi: #3cc4c2;
  --amber: #f2b84b;
  --paper: #ffffff;
  --fg-tint: #ffffff;
  --s-locked: #22344d;
  --s-done: #1b2b42;
  --sw-off: #2b3a52;
  --tabbar: rgba(11, 20, 34, .96);
  --pop: rgba(36, 48, 66, .96);
  --pop-text: #c9d2de;
  --sheet: #15233a;
  --f-display: "Poppins", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { background: var(--ink); color: var(--text); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button[disabled] { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--teal-hi); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* ---------- presenter page ---------- */
.brandbar { display: flex; height: 5px; }
.brandbar span { flex: 1; background: var(--coral); }
.brandbar span + span { background: var(--teal); }
.wrap { max-width: 1260px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 56px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.lockup { display: flex; align-items: center; gap: 11px; }
.wm { font-family: var(--f-display); line-height: 1; }
.wm b { display: block; font-weight: 700; font-size: 18px; color: var(--paper); }
.wm i { display: block; font-style: normal; font-weight: 400; font-size: 18px; color: var(--teal); margin-top: 1px; }
.top-meta { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.pill { border: 1px solid var(--line-2); border-radius: 999px; padding: 3px 11px; color: var(--text); font-size: 12.5px; }
.intro { padding-block: 26px 24px; max-width: 74ch; }
.intro h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(30px, 4.2vw, 44px); line-height: 1.12; margin: 0 0 10px; letter-spacing: -.01em; text-wrap: balance; }
.intro h1 span { color: var(--teal-hi); }
.intro p { margin: 0; color: var(--muted); font-size: 16px; }
.duo-stage { display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 28px; align-items: start; }
.phones { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; scroll-margin-top: 12px; }
.phone-col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.phone-label { display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: var(--muted); }
.phone-label b { color: var(--text); font-family: var(--f-display); font-weight: 600; font-size: 14.5px; }
.device-note { margin: 12px 0 0; font-size: 12.5px; color: var(--faint); text-align: center; }
.device-note b { color: var(--muted); font-weight: 500; border: 1px dashed var(--line-2); border-radius: 6px; padding: 0 6px; }

/* ---------- phone ---------- */
.phone { width: 360px; height: 760px; padding: 10px; border-radius: 54px; background: linear-gradient(160deg, #2a3445, #0a0e15 55%, #1c2533); box-shadow: 0 0 0 1px color-mix(in srgb, var(--fg-tint) 6%, transparent), 0 30px 80px rgba(0,0,0,.55); }
.screen { position: relative; width: 100%; height: 100%; border-radius: 44px; overflow: hidden; background: var(--deep); display: flex; flex-direction: column; isolation: isolate; }
.statusbar { flex: none; height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 6px 28px 0 32px; font-family: var(--f-display); font-weight: 600; font-size: 14.5px; position: relative; z-index: 5; }
.sb-time { font-variant-numeric: tabular-nums; }
.island { position: absolute; left: 50%; top: 10px; width: 110px; height: 31px; margin-left: -55px; background: #000; border-radius: 20px; }
.sb-icons { display: flex; gap: 6px; align-items: center; }
.sb-icons svg { width: 17px; height: 12px; }
.home-ind { position: absolute; left: 50%; bottom: 7px; width: 124px; height: 5px; margin-left: -62px; border-radius: 3px; background: color-mix(in srgb, var(--fg-tint) 75%, transparent); z-index: 40; pointer-events: none; }
.app { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* ---------- in-app shared ---------- */
.app-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 18px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: none; }
.app-scroll::-webkit-scrollbar { display: none; }
.app-scroll > *, .sheet > *, .login > * { flex-shrink: 0; }
.app-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 4px; }
.co { display: flex; align-items: center; gap: 9px; min-width: 0; }
.co span { font-family: var(--f-display); font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.co-logo { object-fit: contain; border-radius: 22%; background: var(--paper); flex: none; }
.pcmark { flex: none; display: block; }
.head-r { display: flex; align-items: center; gap: 8px; flex: none; }
.bell { position: relative; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line-2); background: none; display: grid; place-items: center; color: var(--text); }
.bell svg { width: 19px; height: 19px; }
.badge { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; background: var(--coral); color: var(--navy); font-size: 11px; font-weight: 700; display: grid; place-items: center; line-height: 1; }
.avatar { width: 36px; height: 36px; border-radius: 50%; border: 0; background: linear-gradient(135deg, var(--coral), var(--teal)); font-family: var(--f-display); font-weight: 600; font-size: 13px; color: var(--paper); flex: none; }
.app-title { font-family: var(--f-display); font-weight: 700; font-size: 25px; margin: 0; letter-spacing: -.01em; }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sec-h { margin: 4px 0 -6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.card { background: var(--navy); border: 1px solid var(--line); border-radius: 20px; padding: 15px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 14px; border: 1px solid transparent; font-weight: 600; font-size: 15px; width: 100%; }
.btn svg { width: 20px; height: 20px; }
.btn.sm { min-height: 40px; font-size: 14px; border-radius: 12px; }
.btn.primary { background: var(--teal); color: var(--paper); }
.btn.primary:hover { background: color-mix(in srgb, var(--teal) 88%, white); }
.btn.ghost { background: transparent; border-color: var(--line-2); color: var(--text); }
.btn.ghost:hover { border-color: var(--teal-hi); }
.btn.danger { background: transparent; border-color: color-mix(in srgb, var(--coral) 45%, transparent); color: var(--coral); }
.demo { display: inline-flex; align-items: center; justify-content: center; gap: 6px; align-self: center; border: 1.5px dashed color-mix(in srgb, var(--amber) 65%, transparent); color: var(--amber); background: color-mix(in srgb, var(--amber) 6%, transparent); border-radius: 12px; padding: 8px 14px; font-size: 13px; font-weight: 600; }
.hint { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.hint b { color: var(--text); font-weight: 600; }
.powered { display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 12px; color: var(--faint); }
.powered b { color: var(--muted); font-weight: 600; font-family: var(--f-display); }
.chip { font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 3px 9px; white-space: nowrap; background: color-mix(in srgb, var(--fg-tint) 6%, transparent); color: var(--muted); }
.chip.in { background: color-mix(in srgb, var(--teal) 20%, transparent); color: var(--teal-hi); }
.chip.late, .chip.pend { background: color-mix(in srgb, var(--amber) 14%, transparent); color: var(--amber); }
.chip.bad { background: color-mix(in srgb, var(--coral) 16%, transparent); color: var(--coral); }
.soon { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--line-2); color: var(--muted); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }

/* splash, login, perms */
.splash { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; position: relative; cursor: pointer; }
.splash-name { font-family: var(--f-display); font-weight: 700; font-size: 26px; margin-top: 6px; }
.splash-co { color: var(--muted); font-size: 14px; margin-top: -10px; }
.splash .powered { position: absolute; bottom: 34px; }
.login { flex: 1; overflow-y: auto; padding: 14px 22px 26px; display: flex; flex-direction: column; gap: 13px; scrollbar-width: none; }
.login::-webkit-scrollbar { display: none; }
.login-top { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding-top: 10px; }
.login-top h1 { font-family: var(--f-display); font-weight: 700; font-size: 27px; margin: 10px 0 0; line-height: 1.2; }
.login-top p { margin: 0; color: var(--muted); font-size: 14px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--navy); border: 1px solid var(--line); border-radius: 14px; }
.seg button { border: 0; background: none; min-height: 40px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--teal); color: var(--paper); }
.seg button[disabled] { opacity: .45; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: 13px; color: var(--muted); font-weight: 500; }
.field label .opt { color: var(--faint); font-weight: 400; }
.field input, .field textarea { min-height: 48px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--navy); padding: 0 14px; font-size: 15px; min-width: 0; width: 100%; }
.field textarea { padding: 11px 14px; resize: none; min-height: 64px; line-height: 1.4; }
.field input:focus, .field textarea:focus { border-color: var(--teal-hi); outline: none; }
.pw { position: relative; }
.pw input { padding-right: 64px; }
.pw button { position: absolute; right: 6px; top: 6px; height: 36px; border: 0; background: none; color: var(--teal-hi); font-size: 13px; font-weight: 600; padding: 0 10px; }
.err { margin: 0; color: var(--coral); font-size: 13px; }
.or { display: flex; align-items: center; gap: 12px; color: var(--faint); font-size: 12.5px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line-2); }
.forgot { align-self: center; color: var(--teal-hi); font-size: 13.5px; background: none; border: 0; }
.login .powered { margin-top: auto; padding-top: 8px; }
.sub-hint { margin: -6px 0 0; text-align: center; font-size: 12px; color: var(--faint); }
.perm-list { display: flex; flex-direction: column; gap: 10px; }
.perm { display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: 12px; align-items: center; background: var(--navy); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.perm-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--teal) 16%, transparent); color: var(--teal-hi); }
.perm-ic svg { width: 21px; height: 21px; }
.perm b { display: block; font-size: 14.5px; }
.perm span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.perm button { border: 1px solid var(--line-2); background: none; border-radius: 10px; padding: 6px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.perm button.on { border-color: transparent; background: color-mix(in srgb, var(--teal) 20%, transparent); color: var(--teal-hi); }

/* employee home */
.hello h2 { font-family: var(--f-display); font-weight: 600; font-size: 21px; margin: 2px 0 2px; }
.dates { margin: 0; display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 12.5px; color: var(--muted); }
.dates span + span::before { content: "·"; margin-right: 10px; color: var(--faint); }
.loc-row { display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 10px; align-items: center; }
.loc-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--fg-tint) 5%, transparent); color: var(--muted); }
.loc-ic svg { width: 19px; height: 19px; }
.loc-row.in .loc-ic { background: color-mix(in srgb, var(--teal) 18%, transparent); color: var(--teal-hi); }
.loc-row b { display: block; font-size: 14.5px; }
.loc-row .addr { display: block; font-size: 12.5px; color: var(--muted); }
.zone { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 4px 10px; white-space: nowrap; background: color-mix(in srgb, var(--fg-tint) 6%, transparent); color: var(--muted); }
.zone.in { background: color-mix(in srgb, var(--teal) 20%, transparent); color: var(--teal-hi); }
.zone.off { background: color-mix(in srgb, var(--amber) 12%, transparent); color: var(--amber); }
.punch { display: grid; place-items: center; padding: 16px 0 4px; }
.punch-btn { position: relative; width: 160px; height: 160px; border-radius: 50%; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: var(--teal); color: var(--paper); box-shadow: 0 14px 34px color-mix(in srgb, var(--teal) 35%, transparent), inset 0 0 0 8px color-mix(in srgb, var(--fg-tint) 8%, transparent); transition: transform .15s; }
.punch-btn:active { transform: scale(.97); }
.punch-btn svg { width: 28px; height: 28px; }
.pb-label { font-family: var(--f-display); font-weight: 700; font-size: 20px; }
.pb-time { font-family: var(--f-mono); font-size: 14px; opacity: .9; font-variant-numeric: tabular-nums; }
.punch-btn.out { background: var(--coral); color: var(--navy); box-shadow: 0 14px 34px color-mix(in srgb, var(--coral) 30%, transparent), inset 0 0 0 8px color-mix(in srgb, var(--fg-tint) 12%, transparent); }
.punch-btn.locked { background: var(--s-locked); color: var(--muted); box-shadow: inset 0 0 0 8px color-mix(in srgb, var(--fg-tint) 4%, transparent); }
.punch-btn.done { background: var(--s-done); color: var(--teal-hi); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--teal-hi) 35%, transparent); cursor: default; }
.punch-btn.live::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--teal-hi) 55%, transparent); animation: ring 1.8s ease-out infinite; }
@keyframes ring { from { transform: scale(.92); opacity: 1; } to { transform: scale(1.12); opacity: 0; } }
.punch-msg { margin: 8px 0 0; text-align: center; font-size: 13px; color: var(--muted); min-height: 20px; }
.punch-msg.warn { color: var(--amber); }
.status-card { display: flex; flex-direction: column; gap: 4px; }
.status-card .demo { margin-top: 8px; }
.row-card { display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: 12px; align-items: center; text-align: left; width: 100%; background: var(--navy); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; }
.row-card:hover { border-color: var(--line-2); }
.rc-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--teal) 16%, transparent); color: var(--teal-hi); }
.rc-ic svg { width: 21px; height: 21px; }
.row-card b { display: block; font-size: 14.5px; }
.row-card span.s { display: block; font-size: 12.5px; color: var(--muted); }
.row-card .chev { width: 18px; height: 18px; color: var(--faint); }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qa { text-align: left; background: var(--navy); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 2px; position: relative; }
.qa svg { width: 22px; height: 22px; color: var(--faint); margin-bottom: 6px; }
.qa b { font-size: 13.5px; color: var(--muted); }
.qa span.s { font-size: 12px; color: var(--faint); }
.qa .soon { position: absolute; top: 10px; right: 10px; }
.today h3 { margin: 0 0 8px; font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.tl-row { display: grid; grid-template-columns: 12px minmax(0,1fr) auto; gap: 10px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
.tl-row:first-of-type { border-top: 0; }
.tl-row b { font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.tl-row em { grid-column: 2 / 4; font-style: normal; font-size: 12px; color: var(--faint); margin-top: -6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--teal-hi); align-self: center; }
.dot.out { background: var(--coral); }
.dot.sum { background: transparent; border: 2px solid var(--muted); }

/* stats, lists */
.sumrow { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.sum { background: var(--navy); border: 1px solid var(--line); border-radius: 14px; padding: 10px; min-width: 0; }
.sum b { display: block; font-family: var(--f-display); font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.3; }
.sum span { font-size: 11.5px; color: var(--muted); display: block; line-height: 1.3; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 7px; }
.tile { background: var(--navy); border: 1px solid var(--line); border-radius: 14px; padding: 9px 8px; min-width: 0; }
.tile b { display: block; font-family: var(--f-display); font-size: 21px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
.tile span { display: block; font-size: 11px; color: var(--muted); line-height: 1.25; }
.tile.t-in b { color: var(--teal-hi); }
.tile.t-late b { color: var(--amber); }
.tile.t-bad b { color: var(--coral); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.chips::-webkit-scrollbar { display: none; }
.fchip { flex: none; border: 1px solid var(--line-2); background: none; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 500; color: var(--muted); }
.fchip.on { background: var(--teal); border-color: transparent; color: #fff; }
.group { background: var(--navy); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.grp-h { display: grid; grid-template-columns: 32px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 11px 12px; background: color-mix(in srgb, var(--fg-tint) 2.5%, transparent); border-bottom: 1px solid var(--line); }
.grp-ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--coral) 14%, transparent); color: var(--coral); }
.grp-ic svg { width: 18px; height: 18px; }
.grp-h b { display: block; font-size: 14px; }
.grp-h span.s { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grp-h .cnt { font-family: var(--f-display); font-weight: 600; font-size: 13px; color: var(--muted); }
.prow { display: grid; grid-template-columns: 36px minmax(0,1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 10px 12px; border-top: 1px solid var(--line); }
.prow:first-of-type { border-top: 0; }
.prow:hover { background: color-mix(in srgb, var(--fg-tint) 3%, transparent); }
.prow b { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow span.s { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 600; font-size: 12.5px; background: var(--raise); color: var(--text); box-shadow: inset 0 0 0 2px var(--line-2); flex: none; }
.av.s-in { box-shadow: inset 0 0 0 2px var(--teal-hi); }
.av.s-late { box-shadow: inset 0 0 0 2px var(--amber); }
.av.s-bad { box-shadow: inset 0 0 0 2px var(--coral); }
.av.lg { width: 52px; height: 52px; font-size: 17px; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--teal-hi); font-weight: 600; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--teal-hi); animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }

/* leave + approvals */
.list { display: flex; flex-direction: column; gap: 10px; }
.lv { background: var(--navy); border: 1px solid var(--line); border-radius: 18px; padding: 13px 14px; display: flex; flex-direction: column; gap: 6px; }
.lv-top { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: center; }
.lv-top.who { grid-template-columns: 36px minmax(0,1fr) auto; gap: 10px; }
.sheet > .lv-top.who { grid-template-columns: 52px minmax(0,1fr) auto; gap: 12px; }
.lv-top b { display: block; font-size: 14.5px; }
.lv-top span.s { display: block; font-size: 12px; color: var(--muted); }
.lv-what { font-size: 14px; }
.lv-what b { font-weight: 600; }
.lv-reason { margin: 0; font-size: 13px; color: var(--muted); }
.lv-meta { margin: 0; font-size: 12px; color: var(--faint); }
.file { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--teal-hi); }
.file svg { width: 15px; height: 15px; }
.lv-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
.dlg { display: grid; grid-template-columns: 40px minmax(0,1fr); gap: 12px; align-items: start; }
.dlg-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--amber) 12%, transparent); color: var(--amber); }
.dlg-ic svg { width: 20px; height: 20px; }
.dlg b { display: block; font-size: 14.5px; }
.dlg span.s { display: block; font-size: 12.5px; color: var(--muted); }
.dlg-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.empty { text-align: center; padding: 18px 10px; color: var(--muted); font-size: 13.5px; border: 1px dashed var(--line-2); border-radius: 16px; }

/* history */
.hist { display: flex; flex-direction: column; background: var(--navy); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.h-row { display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); }
.h-row:first-child { border-top: 0; }
.h-day { text-align: center; line-height: 1.1; }
.h-day b { display: block; font-family: var(--f-display); font-size: 17px; }
.h-day span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.h-times { font-family: var(--f-mono); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.h-meta { font-size: 11.5px; color: var(--faint); }
.sample-tag { font-size: 11px; color: var(--faint); border: 1px solid var(--line-2); border-radius: 999px; padding: 2px 8px; }

/* branches */
.trk { display: flex; flex-direction: column; gap: 12px; }
.trk-top { display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: 12px; align-items: center; }
.trk-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--coral) 14%, transparent); color: var(--coral); }
.trk-ic svg { width: 22px; height: 22px; }
.trk-top b { display: block; font-size: 15px; }
.trk-top span.s { display: block; font-size: 12.5px; color: var(--muted); }
.crew { display: flex; gap: 6px; flex-wrap: wrap; }
.crew .av { width: 32px; height: 32px; font-size: 11.5px; }

/* settings */
.profile { display: flex; gap: 12px; align-items: center; }
.profile b { display: block; font-size: 16px; }
.profile span { display: block; font-size: 12.5px; color: var(--muted); }
.photo { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(135deg, var(--coral), var(--teal)); font-family: var(--f-display); font-weight: 600; font-size: 15px; color: var(--paper); flex: none; }
.set-h { margin: 6px 0 -6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 600; display: flex; gap: 8px; align-items: center; }
.set-h em { font-style: normal; text-transform: none; letter-spacing: 0; color: var(--amber); border: 1px solid color-mix(in srgb, var(--amber) 40%, transparent); border-radius: 999px; padding: 0 7px; font-size: 11px; }
.set-list { background: var(--navy); border: 1px solid var(--line); border-radius: 16px; }
.set-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 11px 14px; border-top: 1px solid var(--line); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; }
.set-row:first-child { border-top: 0; }
.set-row b { display: block; font-size: 14px; font-weight: 500; }
.set-row span.s { display: block; font-size: 12px; color: var(--muted); }
.set-row .val { font-size: 13px; color: var(--muted); }
.sw { width: 50px; height: 30px; border-radius: 999px; border: 0; background: var(--sw-off); position: relative; transition: background .2s; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
.sw[aria-checked="true"] { background: var(--teal); }
.sw[aria-checked="true"]::after { transform: translateX(20px); }
.brand-box { display: flex; flex-direction: column; gap: 10px; padding: 14px; }
.brand-preview { display: flex; align-items: center; gap: 10px; }
.brand-preview span { font-size: 13px; color: var(--muted); }
.brand-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.mini { border: 1px solid var(--line-2); background: none; border-radius: 10px; padding: 7px 12px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.mini:hover { border-color: var(--teal-hi); }
.mini.solid { background: var(--teal); border-color: transparent; color: #fff; }
.mini.on { background: color-mix(in srgb, var(--teal) 22%, transparent); border-color: color-mix(in srgb, var(--teal-hi) 50%, transparent); color: var(--teal-hi); }
.mini[disabled] { opacity: .45; }

/* tab bar */
.tabbar { flex: none; display: grid; grid-template-columns: repeat(var(--n, 4), 1fr); padding: 8px 4px 24px; border-top: 1px solid var(--line); background: var(--tabbar); }
.tab { position: relative; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--faint); font-size: 10.5px; font-weight: 500; padding: 4px 0; }
.tab svg { width: 22px; height: 22px; }
.tab.on { color: var(--teal-hi); }
.tab .badge { top: -2px; right: calc(50% - 22px); }

/* ---------- overlays inside the phone ---------- */
.banner-host, .overlay-host { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
.overlay-host { z-index: 30; }
.banner { pointer-events: auto; position: absolute; left: 8px; right: 8px; top: 50px; display: grid; grid-template-columns: 36px minmax(0,1fr); gap: 10px; text-align: left; background: var(--pop); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid color-mix(in srgb, var(--fg-tint) 10%, transparent); border-radius: 22px; padding: 11px 13px; box-shadow: 0 16px 40px rgba(0,0,0,.45); animation: drop .45s cubic-bezier(.2,.9,.3,1.2); }
@keyframes drop { from { transform: translateY(-130%); opacity: 0; } to { transform: none; opacity: 1; } }
.b-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.b-top b { font-weight: 600; color: var(--text); letter-spacing: .02em; text-transform: uppercase; font-size: 11px; }
.b-title { display: block; font-weight: 600; font-size: 14px; }
.b-body { display: block; font-size: 13px; color: var(--pop-text); line-height: 1.4; }
.ov { position: absolute; inset: 0; pointer-events: auto; display: flex; animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; } }
.ov.dim { background: rgba(5, 9, 16, .62); }
.ov.center { align-items: center; justify-content: center; padding: 20px; }
.ov.bottom { align-items: flex-end; }
.sheet { background: var(--sheet); border: 1px solid var(--line-2); border-radius: 26px; padding: 20px; width: 100%; display: flex; flex-direction: column; gap: 12px; max-height: calc(100% - 36px); overflow-y: auto; scrollbar-width: none; }
.sheet::-webkit-scrollbar { display: none; }
.ov.bottom .sheet { border-radius: 28px 28px 0 0; padding: 12px 18px 30px; border-bottom: 0; animation: up .3s cubic-bezier(.2,.9,.3,1); }
@keyframes up { from { transform: translateY(100%); } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line-2); align-self: center; flex: none; }
.sheet h3 { margin: 0; font-family: var(--f-display); font-size: 19px; font-weight: 600; }
.sheet > p:not([class]) { margin: 0; font-size: 14px; color: var(--muted); }
.sheet > p { margin: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.types { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.types legend { font-size: 13px; color: var(--muted); font-weight: 500; margin-bottom: 6px; padding: 0; }
.tchip { position: relative; }
.tchip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.tchip span { display: inline-block; border: 1px solid var(--line-2); border-radius: 999px; padding: 7px 13px; font-size: 13.5px; font-weight: 500; color: var(--muted); }
.tchip input:checked + span { background: var(--teal); border-color: transparent; color: #fff; }
.tchip input:focus-visible + span { outline: 2px solid var(--teal-hi); outline-offset: 2px; }
.lv-calc { margin: -2px 0 0; font-size: 13px; color: var(--teal-hi); min-height: 18px; }
.attach { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; border: 1px dashed var(--line-2); border-radius: 12px; padding: 9px 12px; font-size: 13.5px; color: var(--muted); cursor: pointer; }
.attach svg { width: 17px; height: 17px; }
.attach.has { color: var(--teal-hi); border-style: solid; }
.rlist { display: flex; flex-direction: column; background: var(--navy); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.rrow { display: grid; grid-template-columns: 22px 36px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 9px 12px; border-top: 1px solid var(--line); cursor: pointer; }
.rrow:first-child { border-top: 0; }
.rrow input { accent-color: var(--teal); width: 18px; height: 18px; margin: 0; }
.rrow b { display: block; font-size: 14px; font-weight: 600; }
.rrow span.s { display: block; font-size: 12px; color: var(--muted); }
.rrow.noav { grid-template-columns: 22px minmax(0,1fr) auto; }
.lead { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--teal-hi); }
.chk { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; }
.faceid { width: 150px; height: 150px; border-radius: 34px; background: var(--pop); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--paper); }
.faceid svg { width: 60px; height: 60px; }
.faceid p { margin: 0; font-size: 14px; font-weight: 500; }
.faceid.scan svg { animation: scan .9s ease-in-out infinite alternate; }
@keyframes scan { from { transform: scale(.94); opacity: .65; } to { transform: scale(1.04); opacity: 1; } }
.faceid.ok { color: var(--teal-hi); }
.success { align-items: center; text-align: center; }
.ok-ring { width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--teal) 20%, transparent); color: var(--teal-hi); animation: pop .35s cubic-bezier(.2,.9,.3,1.4); flex: none; }
.ok-ring svg { width: 36px; height: 36px; }
.success.out .ok-ring { background: color-mix(in srgb, var(--coral) 18%, transparent); color: var(--coral); }
@keyframes pop { from { transform: scale(.4); } }
.big-time { font-family: var(--f-display); font-weight: 700; font-size: 42px; line-height: 1; margin: 0; font-variant-numeric: tabular-nums; }
.big-time small { font-size: 19px; color: var(--muted); font-weight: 500; }
.det { width: 100%; margin: 4px 0 2px; text-align: left; }
.det div { display: grid; grid-template-columns: 74px minmax(0,1fr); gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.det dt { color: var(--faint); }
.det dd { margin: 0; }
.det dd.warn { color: var(--amber); }
.notified { margin: 0; display: inline-flex; gap: 7px; align-items: center; font-size: 13px; color: var(--teal-hi); }
.notified svg { width: 16px; height: 16px; }
.inbox { display: flex; flex-direction: column; }
.ib { display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 10px; text-align: left; border: 0; background: none; padding: 10px 2px; border-top: 1px solid var(--line); }
.ib:first-child { border-top: 0; }
.ib-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--teal) 16%, transparent); color: var(--teal-hi); }
.ib-ic.late { background: color-mix(in srgb, var(--amber) 14%, transparent); color: var(--amber); }
.ib-ic.out { background: color-mix(in srgb, var(--coral) 14%, transparent); color: var(--coral); }
.ib-ic svg { width: 18px; height: 18px; }
.ib b { display: block; font-size: 13.5px; }
.ib span.s { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.ib em { display: block; font-style: normal; font-size: 11px; color: var(--faint); margin-top: 2px; }
.ib.unread b::after { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--coral); margin-left: 6px; vertical-align: middle; }
.soon-hero { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; background: color-mix(in srgb, var(--fg-tint) 6%, transparent); color: var(--muted); align-self: center; }
.soon-hero svg { width: 32px; height: 32px; }
.toast { position: absolute; left: 14px; right: 14px; bottom: 96px; z-index: 35; display: flex; gap: 10px; align-items: center; background: var(--pop); border: 1px solid var(--line-2); color: var(--text); border-radius: 14px; padding: 10px 13px; font-size: 13px; box-shadow: 0 12px 30px rgba(0,0,0,.4); animation: fade .2s ease; }
.toast[hidden] { display: none; }
.toast.warn { border-color: color-mix(in srgb, var(--amber) 50%, transparent); color: var(--amber); }
.toast.other { border-color: color-mix(in srgb, var(--teal-hi) 45%, transparent); }
.toast svg { width: 18px; height: 18px; flex: none; color: var(--teal-hi); }
.toast b { color: var(--teal-hi); font-weight: 600; margin-right: 4px; }
.demo-sheet h4 { margin: 4px 0 -4px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
.demo-sheet h4 span { text-transform: none; letter-spacing: 0; color: var(--muted); font-weight: 500; }
.dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dgrid .mini { min-height: 40px; }
.fab { position: absolute; right: 14px; bottom: 82px; z-index: 25; border: 1.5px dashed color-mix(in srgb, var(--amber) 75%, transparent); background: var(--tabbar); color: var(--amber); border-radius: 999px; padding: 6px 13px; font-size: 12px; font-weight: 700; letter-spacing: .04em; }

/* short permission + maps */
.maplink { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); border-radius: 999px; padding: 5px 11px; font-size: 12.5px; font-weight: 600; color: var(--teal-hi); text-decoration: none; white-space: nowrap; }
.maplink svg { width: 15px; height: 15px; }
.maplink:hover { border-color: var(--teal-hi); }
.maplink.sm { padding: 0 8px; font-size: 11.5px; gap: 4px; margin-left: 6px; vertical-align: 1px; }
.maplink.sm svg { width: 12px; height: 12px; }
.ex-card { display: flex; flex-direction: column; gap: 10px; }
.ex-card.active { border-color: color-mix(in srgb, var(--amber) 50%, transparent); }
.ex-card.over { border-color: color-mix(in srgb, var(--coral) 65%, transparent); }
.ex-top { display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: 12px; align-items: center; }
.ex-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--amber) 14%, transparent); color: var(--amber); }
.ex-ic svg { width: 21px; height: 21px; }
.ex-top b { display: block; font-size: 14.5px; }
.ex-top span.s { display: block; font-size: 12.5px; color: var(--muted); }
.ex-count { font-family: var(--f-display); font-weight: 700; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--amber); }
.ex-count small { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 6px; }
.ex-card.over .ex-count { color: var(--coral); }
.gps { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.gps b { color: var(--text); font-weight: 600; }
.cover { margin: 0; font-size: 12.5px; color: var(--teal-hi); display: flex; gap: 6px; align-items: flex-start; line-height: 1.45; }
.cover.bad { color: var(--coral); }
.cover svg { width: 15px; height: 15px; flex: none; margin-top: 2px; }
.btn.amber { background: var(--amber); color: var(--navy); }
.btn[disabled] { opacity: .45; }
.grp-h .cnt.bad { color: var(--coral); font-size: 12px; }
.rc-ic.amb { background: color-mix(in srgb, var(--amber) 14%, transparent); color: var(--amber); }
.ib-ic.ex { background: color-mix(in srgb, var(--amber) 14%, transparent); color: var(--amber); }
.chip.ex { background: color-mix(in srgb, var(--amber) 14%, transparent); color: var(--amber); }

/* ---------- Arabic, right to left ---------- */
html[lang="ar"] { --f-display: "IBM Plex Sans Arabic", "Poppins", "Segoe UI", Tahoma, sans-serif; }
.row-card, .qa, .prow, .set-row, .banner, .det, .ib, .rrow { text-align: start; }
[dir="rtl"] .badge { right: auto; left: -4px; }
[dir="rtl"] .pw input { padding-right: 14px; padding-left: 64px; }
[dir="rtl"] .pw button { right: auto; left: 6px; }
[dir="rtl"] .dates span + span::before { margin-right: 0; margin-left: 10px; }
[dir="rtl"] .qa .soon { right: auto; left: 10px; }
[dir="rtl"] .sw::after { left: auto; right: 3px; }
[dir="rtl"] .sw[aria-checked="true"]::after { transform: translateX(-20px); }
[dir="rtl"] .tab .badge { right: auto; left: calc(50% - 22px); }
[dir="rtl"] .ib.unread b::after { margin-left: 0; margin-right: 6px; }
[dir="rtl"] .toast b { margin-right: 0; margin-left: 4px; }
[dir="rtl"] .fab { right: auto; left: 14px; }
[dir="rtl"] .maplink.sm { margin-left: 0; margin-right: 6px; }
[dir="rtl"] .ex-count small { margin-left: 0; margin-right: 6px; }
[dir="rtl"] .chev, [dir="rtl"] .set-row > svg { transform: scaleX(-1); }
[dir="rtl"] .h-times, [dir="rtl"] .mono, [dir="rtl"] .pb-time, [dir="rtl"] .big-time, [dir="rtl"] .sb-time { direction: ltr; unicode-bidi: isolate; }
[dir="rtl"] .ex-count { direction: ltr; text-align: right; }
.langbtn { border: 1px solid var(--line-2); background: none; color: var(--teal-hi); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; font-weight: 600; font-family: var(--f-body); }
.login-top { position: relative; width: 100%; }
.login-top .langbtn { position: absolute; top: 12px; inset-inline-end: 0; }

/* ---------- presenter script ---------- */
.script { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.script-head h2 { font-family: var(--f-display); font-size: 20px; margin: 0 0 4px; font-weight: 600; }
.script-head p { margin: 0; color: var(--muted); font-size: 13.5px; }
.p-hint { margin: 0; font-size: 13px; color: var(--amber); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.step { display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 11px; padding: 12px 0; border-top: 1px solid var(--line); }
.step:first-child { border-top: 0; padding-top: 0; }
.num { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 13px; background: color-mix(in srgb, var(--teal) 14%, transparent); color: var(--teal-hi); }
.step.done .num { background: var(--teal); color: #fff; }
.step.done .num::before { content: "✓"; }
.step.done .num span { display: none; }
.step h3 { margin: 2px 0 2px; font-size: 14.5px; font-weight: 600; }
.step p { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
